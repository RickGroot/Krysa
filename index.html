<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krysa · Prague Week</title>
<meta name="description" content="The rat-themed team planner for the FrontKon week in Prague.">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The first screen's two fonts (src/fonts), fetched straight away instead of after the stylesheet. -->
<link rel="preload" href="./src/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./src/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body data-tab="today">
<a class="skip" href="#main">Skip to content</a>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="today"><span class="ti" data-icon="today"></span><span class="tl">Today</span><span class="count" id="c-today" aria-hidden="true"></span><span class="sr" id="c-today-sr"></span></button>
  <button type="button" data-tab="week"><span class="ti" data-icon="week"></span><span class="tl">Week</span></button>
  <button type="button" data-tab="rats"><span class="ti" data-icon="rats"></span><span class="tl">Rats</span></button>
  <button type="button" data-tab="money"><span class="ti" data-icon="money"></span><span class="tl">Money</span></button>
  <button type="button" data-tab="trip"><span class="ti" data-icon="trip"></span><span class="tl">Trip</span><span class="count" id="c-trip" aria-hidden="true"></span><span class="sr" id="c-trip-sr"></span></button>
</nav>
<div class="page">
  <header class="band" id="band">
    <div class="band-art" id="band-art" aria-hidden="true"></div>
    <div class="band-in">
      <div class="band-notes" id="band-notes"></div>
      <div class="band-body" id="band-body"></div>
    </div>
  </header>
  <div class="wrap">
    <main id="main" tabindex="-1"><div class="skel" aria-label="Loading the plan"><i></i><i></i><i></i></div></main>
  </div>
</div>
<button class="fab" id="fab" type="button" hidden></button>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
